name: Publish hpmmfgctl
on:
  push:
    tags: ['hpmmfgctl-v*']
permissions:
  contents: read
concurrency:
  group: hpmmfgctl-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp-servers/hpmmfgctl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11 --registry=https://registry.npmjs.org/
      - name: Verify release tag
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json', 'utf8')); if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== 'hpmmfgctl-v' + version) throw new Error('Release tag must match stable package version');"
      - run: npm ci
      - run: npm publish --access public --registry=https://registry.npmjs.org/

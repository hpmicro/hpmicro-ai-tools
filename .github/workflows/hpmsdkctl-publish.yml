name: Publish hpmsdkctl

on:
  push:
    tags:
      - "hpmsdkctl-v*"

permissions:
  contents: read

concurrency:
  group: hpmsdkctl-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: mcp-servers/hpmsdkctl

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install publishing-compatible npm
        run: npm install --global npm@11 --registry=https://registry.npmjs.org/

      - name: Verify release tag
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const { version } = JSON.parse(
              readFileSync("package.json", "utf8")
            );

            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error("A stable package version is required");
            }

            const expectedTag = `hpmsdkctl-v${version}`;
            if (process.env.GITHUB_REF_NAME !== expectedTag) {
              throw new Error(`Release tag must be ${expectedTag}`);
            }
          '

      - name: Install dependencies
        run: npm ci

      # prepublishOnly checks, builds, and tests the package before publishing.
      - name: Publish to npm
        run: npm publish --access public --registry=https://registry.npmjs.org/
